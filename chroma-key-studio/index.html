<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时绿幕抠像 · 虚拟背景合成器</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="app-header">
  <h1>🎬 实时绿幕抠像 · 虚拟背景合成器</h1>
  <div class="header-right">
    <span id="renderer-label" class="badge badge-gl">WebGL2</span>
    <button id="btn-toggle-renderer" class="btn btn-sm">切换到 CPU</button>
  </div>
</header>

<div id="app">
  <!-- ============ 左侧控制面板 ============ -->
  <aside id="sidebar">

    <details class="panel" open>
      <summary>📹 视频源</summary>
      <div class="panel-body">
        <div class="btn-row">
          <button id="btn-camera" class="btn">📷 摄像头</button>
          <button id="btn-file" class="btn">📁 视频文件</button>
          <button id="btn-test" class="btn">🧪 测试画面</button>
        </div>
        <input type="file" id="file-input" accept="video/*" hidden>
        <div class="info-grid">
          <div class="info-item"><span>来源</span><b id="info-source">—</b></div>
          <div class="info-item"><span>分辨率</span><b id="info-res">—</b></div>
          <div class="info-item"><span>帧率</span><b id="info-fps">—</b></div>
          <div class="info-item"><span>色彩空间</span><b id="info-colorspace">—</b></div>
        </div>
      </div>
    </details>

    <details class="panel" open>
      <summary>✂️ 色度键抠像</summary>
      <div class="panel-body">
        <div class="btn-row">
          <button id="btn-eyedropper" class="btn">💧 吸管取色</button>
          <button id="btn-key-green" class="btn btn-sm swatch-green">绿幕</button>
          <button id="btn-key-blue" class="btn btn-sm swatch-blue">蓝幕</button>
        </div>
        <div class="hint" id="eyedropper-hint">点击「吸管取色」后，在左侧「原始」画面上点击选取背景色</div>
        <div class="ctl"><label>键色(自定义)</label><input type="color" id="key-color" data-bind="key.color"><output></output></div>
        <div class="ctl"><label>色彩空间</label>
          <select id="key-space" data-bind="key.space">
            <option value="rgb">RGB</option>
            <option value="yuv" selected>YUV</option>
            <option value="hsv">HSV</option>
          </select>
        </div>
        <div class="ctl"><label>相似度阈值</label><input type="range" data-bind="key.similarity" min="0" max="1" step="0.005"><output></output></div>
        <div class="ctl"><label>平滑度</label><input type="range" data-bind="key.smoothness" min="0" max="0.5" step="0.005"><output></output></div>
        <div class="ctl"><label>边缘收缩</label><input type="range" data-bind="key.shrink" min="0" max="1" step="0.01"><output></output></div>
        <div class="ctl"><label>边缘羽化</label><input type="range" data-bind="key.feather" min="0" max="0.5" step="0.005"><output></output></div>
      </div>
    </details>

    <details class="panel">
      <summary>🎭 遮罩后处理</summary>
      <div class="panel-body">
        <div class="ctl"><label>腐蚀(erode)</label><input type="range" data-bind="mask.erode" min="0" max="8" step="0.5" data-fmt="1"><output></output></div>
        <div class="ctl"><label>膨胀(dilate)</label><input type="range" data-bind="mask.dilate" min="0" max="8" step="0.5" data-fmt="1"><output></output></div>
        <div class="ctl"><label>高斯模糊/羽化</label><input type="range" data-bind="mask.blur" min="0" max="8" step="0.5" data-fmt="1"><output></output></div>
        <div class="ctl"><label>噪点抑制</label><input type="range" data-bind="mask.noise" min="0" max="1" step="0.05"><output></output></div>
        <div class="ctl"><label>半透明保留</label><input type="range" data-bind="mask.keepSemi" min="0" max="1" step="0.05"><output></output></div>
        <div class="hint">遮罩直方图实时显示在中间「遮罩」预览窗格下方</div>
      </div>
    </details>

    <details class="panel">
      <summary>🟢 溢色抑制</summary>
      <div class="panel-body">
        <div class="ctl"><label>类型</label>
          <select data-bind="spill.type">
            <option value="auto" selected>自动(跟随键色)</option>
            <option value="green">绿色溢色</option>
            <option value="blue">蓝色溢色</option>
          </select>
        </div>
        <div class="ctl"><label>抑制强度</label><input type="range" data-bind="spill.strength" min="0" max="1" step="0.05"><output></output></div>
        <div class="ctl"><label>边缘颜色校正</label><input type="range" data-bind="spill.edgeCorrect" min="0" max="1" step="0.05"><output></output></div>
        <div class="hint">溢色抑制在调色之前生效，与前景调色联动</div>
      </div>
    </details>

    <details class="panel">
      <summary>🖼 背景合成</summary>
      <div class="panel-body">
        <div class="ctl"><label>背景类型</label>
          <select data-bind="bg.type">
            <option value="color" selected>纯色背景</option>
            <option value="image">图片背景</option>
            <option value="video">视频背景</option>
            <option value="blur">原视频模糊</option>
          </select>
        </div>
        <div class="ctl"><label>背景色</label><input type="color" data-bind="bg.color"><output></output></div>
        <div class="btn-row">
          <button id="btn-bg-image" class="btn btn-sm">🖼 选择图片</button>
          <button id="btn-bg-video" class="btn btn-sm">🎞 选择视频</button>
        </div>
        <input type="file" id="bg-image-input" accept="image/*" hidden>
        <input type="file" id="bg-video-input" accept="video/*" hidden>
        <div class="hint" id="bg-file-label">未加载背景素材</div>
        <div class="ctl"><label>背景循环</label><input type="checkbox" data-bind="bg.loop" checked></div>
        <div class="ctl"><label>背景缩放</label><input type="range" data-bind="bg.scale" min="0.5" max="2.5" step="0.05"><output></output></div>
        <div class="ctl"><label>水平位移</label><input type="range" data-bind="bg.offsetX" min="-1" max="1" step="0.01"><output></output></div>
        <div class="ctl"><label>垂直位移</label><input type="range" data-bind="bg.offsetY" min="-1" max="1" step="0.01"><output></output></div>
        <div class="ctl"><label>模糊量(模糊背景)</label><input type="range" data-bind="bg.blurAmount" min="0" max="24" step="1" data-fmt="0"><output></output></div>
        <div class="ctl"><label>前景↔背景色彩匹配</label><input type="range" data-bind="bg.colorMatch" min="0" max="1" step="0.05"><output></output></div>
      </div>
    </details>

    <details class="panel">
      <summary>🎨 前景调色</summary>
      <div class="panel-body">
        <div class="ctl"><label>亮度</label><input type="range" data-bind="grade.brightness" min="-0.5" max="0.5" step="0.01"><output></output></div>
        <div class="ctl"><label>对比度</label><input type="range" data-bind="grade.contrast" min="0" max="2" step="0.01"><output></output></div>
        <div class="ctl"><label>饱和度</label><input type="range" data-bind="grade.saturation" min="0" max="2" step="0.01"><output></output></div>
        <div class="ctl"><label>色温</label><input type="range" data-bind="grade.temperature" min="-1" max="1" step="0.01"><output></output></div>
        <div class="ctl"><label>色调</label><input type="range" data-bind="grade.tint" min="-1" max="1" step="0.01"><output></output></div>
        <div class="ctl"><label>光照统一(背景→前景)</label><input type="range" data-bind="grade.lightUnify" min="0" max="1" step="0.05"><output></output></div>
        <label class="sub-label">基础曲线调整（拖动控制点）</label>
        <canvas id="curve-editor" width="280" height="130"></canvas>
        <button id="btn-curve-reset" class="btn btn-sm">重置曲线</button>
      </div>
    </details>

    <details class="panel" open>
      <summary>⚡ 性能面板</summary>
      <div class="panel-body">
        <div class="perf-grid">
          <div class="perf-item"><span>帧率</span><b id="perf-fps">—</b></div>
          <div class="perf-item"><span>帧耗时</span><b id="perf-frame">—</b></div>
          <div class="perf-item"><span>CPU 耗时</span><b id="perf-cpu">—</b></div>
          <div class="perf-item"><span>GPU 耗时</span><b id="perf-gpu">—</b></div>
          <div class="perf-item"><span>丢帧统计</span><b id="perf-dropped">0</b></div>
          <div class="perf-item"><span>渲染分辨率</span><b id="perf-res">—</b></div>
        </div>
        <div class="ctl"><label>分辨率降采样</label><input type="range" data-bind="render.scale" min="0.25" max="1" step="0.05"><output></output></div>
        <div class="ctl"><label>动态质量调节</label><input type="checkbox" data-bind="render.dynamicQuality" checked></div>
        <button id="btn-reset-dropped" class="btn btn-sm">重置丢帧统计</button>
      </div>
    </details>

    <details class="panel">
      <summary>💾 参数预设与导出</summary>
      <div class="panel-body">
        <div class="ctl"><label>预设</label><select id="preset-select"></select></div>
        <div class="btn-row">
          <input type="text" id="preset-name" class="text-input" placeholder="新预设名称">
          <button id="btn-preset-save" class="btn btn-sm">保存</button>
          <button id="btn-preset-delete" class="btn btn-sm">删除</button>
        </div>
        <div class="btn-row">
          <button id="btn-import" class="btn btn-sm">📥 导入预设JSON</button>
          <button id="btn-export-params" class="btn btn-sm">📤 导出参数JSON</button>
        </div>
        <input type="file" id="import-input" accept="application/json,.json" hidden>
        <div class="btn-row">
          <button id="btn-export-mask" class="btn btn-sm">🎭 导出遮罩图</button>
          <button id="btn-export-report" class="btn btn-sm">📊 导出对比报告</button>
        </div>
      </div>
    </details>

  </aside>

  <!-- ============ 右侧预览区 ============ -->
  <main id="main">
    <div class="preview-toolbar">
      <span class="tb-label">对比:</span>
      <button id="cmp-off" class="btn btn-sm active">关闭</button>
      <button id="cmp-wipe" class="btn btn-sm">滑动对比</button>
      <button id="cmp-split" class="btn btn-sm">50/50 分屏</button>
      <span class="tb-sep"></span>
      <button id="btn-bypass" class="btn btn-sm">👁 前后切换</button>
      <button id="btn-magnifier" class="btn btn-sm">🔍 放大镜</button>
    </div>

    <div class="preview-grid">
      <div class="pane">
        <div class="pane-label">原始画面</div>
        <canvas id="canvas-src"></canvas>
      </div>
      <div class="pane">
        <div class="pane-label">遮罩 (Alpha)</div>
        <canvas id="canvas-mask"></canvas>
        <canvas id="histogram" width="256" height="56"></canvas>
        <div class="pane-sub">遮罩直方图</div>
      </div>
      <div class="pane">
        <div class="pane-label">合成画面</div>
        <div class="composite-wrap" id="composite-wrap">
          <canvas id="canvas-out"></canvas>
          <canvas id="canvas-compare"></canvas>
          <div id="compare-handle"><span>◂ 原始 | 合成 ▸</span></div>
          <canvas id="magnifier" width="150" height="150"></canvas>
        </div>
      </div>
    </div>

    <div class="transport">
      <button id="btn-play" class="btn">⏸ 暂停</button>
      <button id="btn-prev" class="btn btn-sm">⏮ 上一帧</button>
      <button id="btn-next" class="btn btn-sm">⏭ 下一帧</button>
      <label class="chk"><input type="checkbox" id="chk-loop" checked> 循环</label>
      <label class="chk"><input type="checkbox" id="chk-mute" checked> 静音</label>
      <input type="range" id="seek-range" min="0" max="1000" value="0">
      <span id="time-label">00:00 / 00:00</span>
    </div>
  </main>
</div>

<footer id="status-bar">就绪</footer>

<!-- 隐藏媒体元素 -->
<video id="video-main" class="hidden-media" playsinline muted autoplay></video>
<video id="bg-video" class="hidden-media" playsinline muted loop></video>

<script src="js/color.js"></script>
<script src="js/shaders.js"></script>
<script src="js/glcore.js"></script>
<script src="js/pipeline-gl.js"></script>
<script src="js/pipeline-cpu.js"></script>
<script src="js/sources.js"></script>
<script src="js/background.js"></script>
<script src="js/presets.js"></script>
<script src="js/perf.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
